name: Sync protocol index

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh Neon read model
        env:
          INDEXER_SYNC_URL: ${{ secrets.INDEXER_SYNC_URL }}
          INDEXER_SECRET: ${{ secrets.INDEXER_SECRET }}
        run: |
          test -n "$INDEXER_SYNC_URL"
          test -n "$INDEXER_SECRET"
          curl --fail-with-body --retry 3 --retry-delay 5 \
            -H "Authorization: Bearer $INDEXER_SECRET" \
            "$INDEXER_SYNC_URL"
